@for (item of items; track item) {
  <label
    ><input
      [attr.data-test]="'ngil-radio-' + formControlName + '-' + item"
      type="radio"
      [disabled]="disabled"
      [name]="formControlName"
      [value]="item"
      [(ngModel)]="value"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="updateModel()"
      (blur)="onBlur()"
      (focus)="onFocus()"
    />{{ item }}</label
  >
}
